name: flake check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly de-smoke run (Mondays 06:00 UTC) — see the de-smoke job below
    - cron: "0 6 * * 1"

# Read-only: nothing in here pushes, comments, or publishes.
permissions:
  contents: read

# A newer push supersedes any in-flight run for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every deep-eval step below runs the ONE shared script, .claude/lib/deep-eval.sh
# (also what the /deep-eval-check skill runs locally). It evaluates every member
# of a flake attrset, keeps going past a failing member, prints a per-member
# verdict, and exits non-zero if any failed — so one broken host never hides the
# rest. To cover another attrset, append a step running
# `bash .claude/lib/deep-eval.sh --set <attr>` (see the de-smoke job).

jobs:
  eval:
    name: evaluate all hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # nix flake check only SHALLOWLY verifies nixosConfigurations (it checks
      # the toplevel is a derivation without forcing its full eval) — a broken
      # package deep in systemPackages sails through it. Proven 2026-07-02:
      # flake check passed while every desktop host failed to evaluate.
      - name: nix flake check
        run: nix flake check --no-build

      # The real gate: force the FULL system derivation of every host in
      # nixosConfigurations. Eval-only, no builds; cross-arch is fine —
      # evaluating the aarch64 vpn-server needs no aarch64 builder. sops
      # secrets stay encrypted; eval never decrypts them.
      - name: deep-evaluate every host
        run: bash .claude/lib/deep-eval.sh

      # .claude/hosts.json drives the host-touching skills (ssh-host,
      # fleet-status, fleet-rollout, ...); fail if its flake hosts drift from
      # the flake's real nixosConfigurations. Runs even if an earlier step
      # failed so both signals are reported.
      - name: hosts.json matches nixosConfigurations
        if: ${{ !cancelled() }}
        run: bash .claude/lib/check-hosts-json.sh

  # Unused DE modules are never evaluated by the host builds above, so they can
  # rot silently across nixpkgs bumps. lib.deSmoke exposes the laptop config
  # with each available DE module swapped in; force-evaluating each one weekly
  # (eval-only, no builds) catches rot without slowing down push/PR runs.
  de-smoke:
    name: smoke-evaluate every desktop environment
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: deep-evaluate laptop with each DE module
        run: bash .claude/lib/deep-eval.sh --set lib.deSmoke

      # Modules no host imports right now (amd.nix, vpn.nix) — evaluated so they
      # can't rot silently while unused.
      - name: deep-evaluate unused modules
        run: bash .claude/lib/deep-eval.sh --set lib.moduleSmoke

      # Further weekly smoke sets go here, one step each, e.g.:
      #   - name: deep-evaluate <what>
      #     run: bash .claude/lib/deep-eval.sh --set lib.<name>
