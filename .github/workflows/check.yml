name: flake check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly de-smoke run (Mondays 06:00 UTC) — see the de-smoke job below
    - cron: "0 6 * * 1"

# A newer push supersedes any in-flight run for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: evaluate all hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      # nix flake check only SHALLOWLY verifies nixosConfigurations (it checks
      # the toplevel is a derivation without forcing its full eval) — a broken
      # package deep in systemPackages sails through it. Proven 2026-07-02:
      # flake check passed while every desktop host failed to evaluate.
      - name: nix flake check
        run: nix flake check --no-build

      # The real gate: force the FULL system derivation of every host
      # (gaming, laptop, natalie-laptop, vpn-server). Eval-only, no builds;
      # cross-arch is fine — evaluating the aarch64 vpn-server needs no
      # aarch64 builder. sops secrets stay encrypted; eval never decrypts them.
      - name: deep-evaluate every host
        run: |
          for host in $(nix eval --raw --apply 'c: builtins.concatStringsSep " " (builtins.attrNames c)' .#nixosConfigurations); do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done

  # Unused DE modules are never evaluated by the host builds above, so they can
  # rot silently across nixpkgs bumps. lib.deSmoke exposes the laptop config
  # with each available DE module swapped in; force-evaluating each one weekly
  # (eval-only, no builds) catches rot without slowing down push/PR runs.
  de-smoke:
    name: smoke-evaluate every desktop environment
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: deep-evaluate laptop with each DE module
        run: |
          for de in $(nix eval --raw --apply 'a: builtins.concatStringsSep " " (builtins.attrNames a)' .#lib.deSmoke); do
            echo "::group::$de"
            nix eval --raw ".#lib.deSmoke.$de.config.system.build.toplevel.drvPath"
            echo
            echo "::endgroup::"
          done
