# sops-nix recipient map.
#
# - admin: your personal age key at ~/.config/sops/age/keys.txt (never committed).
#   Lets you edit any secret.
# - each host: age key derived from its SSH ed25519 host key, so the host can
#   decrypt the secrets encrypted to it at activation time.
#
# secrets/common.yaml       -> all hosts: login password hashes
# secrets/desktop.yaml      -> desktop hosts: tailscale-mcp-env and
#                              discord-webhook-url (both file-owned by bosko
#                              once decrypted)
# secrets/hosts/<host>.yaml -> that host only. gaming has one (pinchflat-env,
#                              jellyfin-api-key and its other gaming-only
#                              secrets), famdash has one (its Wi-Fi env file) and
#                              so does pi-hole (its web password hash and client
#                              list); add a rule below for a new per-host file.
#
# Each secret's sopsFile is set where it is declared — grep for `sops.secrets`
# to see the live wiring. (jellyfin-api-key is stored but not wired into any
# NixOS module yet; it is decrypted on demand.)
keys:
  - &admin          age1u87ds7mavxj6hpmwdzmf6had863h3pl5ezmkpx7wx99pgexf3qzqdsnl84
  - &gaming         age1zqugny5n026jh6q82m85dulc3wuwleysq76qecarf4dchcq4l9vs545sxx
  - &laptop         age1q0jxkfmwgq5acv5u22u9ka2h0kl2raqjtny2z0y8dzy4s630cvrqn6awy9
  - &natalie-laptop age1ryfsw95jndacymzv92w98mnavktagqxl2uyff76v5xvrr00fj97sn68el4
  # famdash's SSH host key is generated BEFORE first boot and copied onto its SD
  # card (never into the image/store), so the Pi can decrypt its Wi-Fi secret and
  # login hashes on the very first boot.
  - &famdash        age1zka0yv4qpfuc7mut9m6sxtqlwcfu4cvc5h8qnr0gha2mnntfy3zsjlt7du
  # pi-hole's SSH host key is likewise generated BEFORE first boot and copied onto
  # its SD card (never into the image/store), so the Pi can decrypt its secrets
  # (login hashes, the Pi-hole web password hash, the client list) on first boot.
  - &pi-hole        age1mmlv3gcr48202k29zgny82mfhwrgvn63mqskcp8r44rafxlwdags2l9txl

creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *gaming
          - *laptop
          - *natalie-laptop
          - *famdash
          - *pi-hole

  - path_regex: secrets/desktop\.yaml$
    key_groups:
      - age:
          - *admin
          - *gaming
          - *laptop
          - *natalie-laptop

  - path_regex: secrets/hosts/gaming\.yaml$
    key_groups:
      - age: [*admin, *gaming]

  - path_regex: secrets/hosts/famdash\.yaml$
    key_groups:
      - age: [*admin, *famdash]

  - path_regex: secrets/hosts/pi-hole\.yaml$
    key_groups:
      - age: [*admin, *pi-hole]
