# sops-nix recipient map.
#
# - admin: your personal age key at ~/.config/sops/age/keys.txt (never committed).
#   Lets you edit any secret.
# - each host: age key derived from its SSH ed25519 host key, so the host can
#   decrypt the secrets encrypted to it at activation time.
#
# secrets/common.yaml       -> all hosts: login password hashes
# secrets/desktop.yaml      -> desktop hosts: tailscale-mcp-env and
#                              discord-webhook-url (both file-owned by bosko
#                              once decrypted)
# secrets/hosts/<host>.yaml -> that host only. Only gaming has one today
#                              (pinchflat-env, jellyfin-api-key and its other
#                              gaming-only secrets); add a rule below for a new
#                              per-host file.
#
# Each secret's sopsFile is set where it is declared — grep for `sops.secrets`
# to see the live wiring. (jellyfin-api-key is stored but not wired into any
# NixOS module yet; it is decrypted on demand.)
keys:
  - &admin          age1u87ds7mavxj6hpmwdzmf6had863h3pl5ezmkpx7wx99pgexf3qzqdsnl84
  - &gaming         age1zqugny5n026jh6q82m85dulc3wuwleysq76qecarf4dchcq4l9vs545sxx
  - &laptop         age1q0jxkfmwgq5acv5u22u9ka2h0kl2raqjtny2z0y8dzy4s630cvrqn6awy9
  - &natalie-laptop age1ryfsw95jndacymzv92w98mnavktagqxl2uyff76v5xvrr00fj97sn68el4

creation_rules:
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin
          - *gaming
          - *laptop
          - *natalie-laptop

  - path_regex: secrets/desktop\.yaml$
    key_groups:
      - age:
          - *admin
          - *gaming
          - *laptop
          - *natalie-laptop

  - path_regex: secrets/hosts/gaming\.yaml$
    key_groups:
      - age: [*admin, *gaming]
