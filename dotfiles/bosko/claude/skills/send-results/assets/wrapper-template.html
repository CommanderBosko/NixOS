<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e4e0d8;
    --text: #262320;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --surface: #262320;
      --border: #3a352e;
      --text: #ece7de;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --surface: #262320;
    --border: #3a352e;
    --text: #ece7de;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 32px 16px;
  }
  pre {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.85rem;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
</style>
