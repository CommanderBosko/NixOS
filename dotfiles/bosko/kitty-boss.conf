# Bosko-only kitty settings for the boss Claude session (~/projects/boss),
# deployed as ~/.config/kitty/kitty.d/boss.conf and pulled in by the shared
# kitty.conf's globinclude. natty never gets these.

# Remote control over a per-process unix socket only (never via the tty), so the
# boss can list, label, recolor, launch, and close kitty windows.
# The socket lives in $XDG_RUNTIME_DIR (mode 0700), so only this user's processes can use it.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
