# Non-default settings only; kitty's stock defaults apply to everything else.
font_family      family="CodeNewRoman Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
cursor_trail 1
sync_to_monitor yes
active_border_color #00ff00
inactive_border_color #cccccc
# Per-user drop-ins: each user's Home Manager config may add files under
# ~/.config/kitty/kitty.d/ (bosko's boss-session settings live in
# dotfiles/bosko/kitty-boss.conf). Matches nothing, harmlessly, when a user has none.
globinclude kitty.d/*.conf
