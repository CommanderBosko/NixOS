# Non-default settings only; kitty's stock defaults apply to everything else.
font_family      family="CodeNewRoman Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
cursor_trail 1
sync_to_monitor yes
active_border_color #00ff00
inactive_border_color #cccccc
# Remote control over a per-process unix socket only (never via the tty), so the
# boss Claude session in ~/projects can list, label, focus, and launch kitty windows.
# The socket lives in $XDG_RUNTIME_DIR (mode 0700), so only this user's processes can use it.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
